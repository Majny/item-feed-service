[project]
name = "feedservice"
version = "0.1.0"
description = "Item feed ingestion service (Recombee home assignment)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "dramatiq[rabbitmq]>=2.2,<3",
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feedservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient nags about httpx -> httpx2; harmless here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, bandit-lite
select = ["F", "E", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the intended style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]  # assert and temp paths are fine in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
