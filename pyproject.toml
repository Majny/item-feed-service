[project]
name = "feedservice"
version = "0.1.0"
description = "Item feed ingestion service (Recombee home assignment)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "dramatiq[rabbitmq]>=1.17",
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feedservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
