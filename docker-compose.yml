x-env: &env
  DATABASE_URL: postgresql+psycopg://feeds:feeds@db:5432/feeds
  BROKER_URL: amqp://guest:guest@rabbitmq:5672/
  DATA_DIR: /data

x-app: &app
  build:
    context: .
    target: app
  environment: *env
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "8000:8000"

  # Parses feeds and upserts items. CPU/DB bound, few threads are enough.
  feed-worker:
    <<: *app
    command: ["dramatiq", "feedservice.tasks", "--queues", "feeds", "--processes", "1", "--threads", "2"]
    environment:
      <<: *env
      # Prefetch only as many messages as there are threads (Dramatiq's default
      # is 2x). RabbitMQ's consumer_timeout counts from delivery, so a long
      # feed message waiting in a local buffer could otherwise be redelivered.
      dramatiq_queue_prefetch: "2"

  # Downloads images, one message per image. Network bound, so many threads;
  # scale with `docker compose up --scale image-worker=N`.
  image-worker:
    <<: *app
    command: ["dramatiq", "feedservice.tasks", "--queues", "images", "--processes", "1", "--threads", "8"]

  # Re-publishes feeds stuck in "processing" (lost or dead-lettered messages).
  # Stateless; running more than one copy is safe.
  sweeper:
    <<: *app
    command: ["python", "-m", "feedservice.sweeper"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feeds
      POSTGRES_PASSWORD: feeds
      POSTGRES_DB: feeds
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeds"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"  # management UI, guest/guest
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Test runner, not started by `docker compose up`:
  #   docker compose run --rm --build tests
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    command: ["pytest", "-v", "-p", "no:cacheprovider"]
    environment:
      DATABASE_URL: postgresql+psycopg://feeds:feeds@db:5432/feeds_test
      BROKER_URL: stub
      DATA_DIR: /tmp/feedservice-test
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
  pgdata:
  rabbitmq:
